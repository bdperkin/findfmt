---
# Exhaustive pre-commit configuration for findfmt
# See https://pre-commit.com for more information
ci:
  autofix_commit_msg: 'style(pre-commit): auto fixes from pre-commit hooks'
  autofix_prs: true
  autoupdate_branch: main
  autoupdate_commit_msg: 'chore(deps): update pre-commit hooks'
  autoupdate_schedule: weekly
  skip:
    - ty
    - interrogate
    - deptry
    - vulture
    - xenon
    - sync-pre-commit-deps
    - pyroma
  submodules: false
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  # Meta pre-commit hooks
  - repo: meta
    hooks:
      - id: check-useless-excludes

  # Pre-commit CI configuration validator
  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config

  # Pre-commit standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/fuzz/

  # UV dependency management
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.30
    hooks:
      - id: uv-lock
      - id: uv-export
        name: uv-export (ClusterFuzzLite)
        files: ^(uv\.lock|pyproject\.toml)$
        args:
          - --frozen
          - --no-dev
          - --no-emit-project
          - --format=requirements-txt
          - --hashes
          - --output-file=.clusterfuzzlite/requirements.txt

  # PyPI packaging compliance
  - repo: https://github.com/regebro/pyroma
    rev: 5.0.1
    hooks:
      - id: pyroma
        args: [-d, --min=10, .]

  # Python code structure: ssort
  - repo: https://github.com/bwhmather/ssort
    rev: 0.17.0
    hooks:
      - id: ssort

  # Python code structure: absolufy-imports
  - repo: https://github.com/marcogorelli/absolufy-imports
    rev: v0.3.1
    hooks:
      - id: absolufy-imports

  # Python code structure: add-trailing-comma
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  # Python code structure: blank-line-after-blocks
  - repo: https://github.com/jsh9/blank-line-after-blocks
    rev: 0.1.4
    hooks:
      - id: blank-line-after-blocks

  # Astral Ruff (Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Codespell for typo detection
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  # Pygrep hooks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char
        exclude: ^(\.pre-commit-config\.yaml)$

  # Validate pyproject.toml
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject

  # Format pyproject.toml
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.5.0
    hooks:
      - id: pyproject-fmt
        args: [--max-supported-python, '3.15']

  # Yamllint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # Blocklint for non-inclusive language
  - repo: https://github.com/PrincetonUniversity/blocklint
    rev: v0.3.0
    hooks:
      - id: blocklint

  # Markdown heading numbering
  - repo: https://github.com/jsh9/markdown-heading-numbering
    rev: 0.1.1
    hooks:
      - id: markdown-heading-numbering
        exclude: ^CHANGELOG\.md$

  # Markdown TOC creator
  - repo: https://github.com/jsh9/markdown-toc-creator
    rev: 0.1.3
    hooks:
      - id: markdown-toc-creator
        args: [--proactive, 'False']

  # Markdown format
  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--number, --wrap, '100', --end-of-line, lf]
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-tables

  # PyMarkdown linter
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.40
    hooks:
      - id: pymarkdown

  # Yamlfix formatter
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.17.0
    hooks:
      - id: yamlfix

  # Security: Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: package.lock.json|uv.lock

  # Conventional Commits verification
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Astral Ty type checker
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
        args: [--group, lint]

  # Interrogate docstring checker
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [src]
        pass_filenames: false

  # Deptry dependency checker
  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry

  # Vulture dead code checker
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: [src]

  # Xenon complexity checker
  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon
        args: [-b, B, -m, B, -a, A, src]
        pass_filenames: false

  # Sync pre-commit dependencies
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.5
    hooks:
      - id: sync-pre-commit-deps

  # File Line Length Enforcement
  - repo: local
    hooks:
      - id: file-line-length-check
        name: File Line Length Check
        entry: python tools/line_linter.py
        language: python
        types: [text]
        additional_dependencies: [pathspec, identify, typer, pyyaml]
        pass_filenames: true
