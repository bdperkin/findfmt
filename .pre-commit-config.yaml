---
# Exhaustive pre-commit configuration for findfmt
# See https://pre-commit.com for more information
ci:
  autofix_commit_msg: 'style(pre-commit): auto fixes from pre-commit hooks'
  autofix_prs: true
  autoupdate_branch: main
  autoupdate_commit_msg: 'chore(deps): update pre-commit hooks'
  autoupdate_schedule: weekly
  skip:
    - ty
    - fmt
    - cargo-check
    - clippy
    - deptry
    - sync-pre-commit-deps
    - pyroma
    - vale
    - vale-commit-msg
  submodules: false

default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  # Meta pre-commit hooks
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      - id: identity
        stages:
          - manual

  # Pre-commit CI configuration validator
  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config

  # Sync pre-commit dependencies
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.5
    hooks:
      - id: sync-pre-commit-deps

  # Pre-commit standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude: ^findfmt_rs/fuzz/seed_corpus/
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        args:
          - --unsafe
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: file-contents-sorter
        files: ^\.github/styles/config/vocabularies/findfmt/(accept|reject)\.txt$
        args:
          - --unique
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
      - id: name-tests-test
        args:
          - --pytest-test-first
        exclude: ^tests/fuzz/

  # Format pyproject.toml
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.31.2
    hooks:
      - id: pyproject-fmt
        args:
          - --max-supported-python
          - '3.15'

  # Format and lint Rust/Cargo TOML manifests
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        files: ^findfmt_rs/.*\.toml$
      - id: taplo-lint
        files: ^findfmt_rs/.*\.toml$
        args:
          - --no-schema

  # Validate pyproject.toml
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject

  # UV dependency management
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock
      - id: uv-export
        name: uv-export (ClusterFuzzLite)
        files: ^(uv\.lock|pyproject\.toml)$
        args:
          - --frozen
          - --no-dev
          - --no-emit-project
          - --format=requirements-txt
          - --hashes
          - --output-file=.clusterfuzzlite/requirements.txt

  # PyPI packaging compliance
  - repo: https://github.com/regebro/pyroma
    rev: 5.0.1
    hooks:
      - id: pyroma
        args:
          - -d
          - --min=10
          - .

  # Python code structure: ssort
  - repo: https://github.com/bwhmather/ssort
    rev: 0.19.0
    hooks:
      - id: ssort

  # Python code structure: absolufy-imports
  - repo: https://github.com/marcogorelli/absolufy-imports  # zizmor: ignore[archived-uses] -- AST normalizer
    rev: v0.3.1
    hooks:
      - id: absolufy-imports

  # Python code structure: add-trailing-comma
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  # Astral Ruff Linter (auto-fixes before final block/whitespace formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --exit-non-zero-on-fix

  # Python code structure: blank-line-after-blocks
  - repo: https://github.com/jsh9/blank-line-after-blocks
    rev: 0.1.4
    hooks:
      - id: blank-line-after-blocks

  # Astral Ruff Formatter (runs last among Python mutators)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-format

  # Astral Ty type checker
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.108
    hooks:
      - id: ty
        args:
          - --group
          - lint

  # Deptry dependency checker
  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry

  # Vulture dead code checker
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args:
          - src

  # Xenon complexity checker
  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon
        args:
          - -b
          - B
          - -m
          - B
          - -a
          - A
          - src
        pass_filenames: false

  # Interrogate docstring checker
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args:
          - src
        pass_filenames: false

  # Rust Cargo formatter, compiler check, and Clippy linter
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        alias: cargo-fmt
        name: cargo-fmt
        files: ^findfmt_rs/
        types:
          - file
        types_or:
          - rust
          - toml
        pass_filenames: false
        args:
          - --manifest-path
          - findfmt_rs/Cargo.toml
      - id: cargo-check
        name: cargo-check
        files: ^findfmt_rs/
        types:
          - file
        types_or:
          - rust
          - toml
        args:
          - --manifest-path
          - findfmt_rs/Cargo.toml
          - --locked
      - id: clippy
        alias: cargo-clippy
        name: cargo-clippy (extension)
        files: ^findfmt_rs/
        types:
          - file
        types_or:
          - rust
          - toml
        args:
          - --manifest-path
          - findfmt_rs/Cargo.toml
          - --locked
          - --lib
          - --
          - -D
          - warnings
      - id: clippy
        alias: cargo-clippy-all-targets
        name: cargo-clippy (all targets)
        files: ^findfmt_rs/
        types:
          - file
        types_or:
          - rust
          - toml
        args:
          - --manifest-path
          - findfmt_rs/Cargo.toml
          - --locked
          - --no-default-features
          - --all-targets
          - --
          - -D
          - warnings

  # Yamlfix formatter
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix

  # Yamllint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -c
          - .yamllint.yaml

  # JSON Schema validation for GitHub and service configuration files
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-codecov
      - id: check-renovate
      - id: check-mergify
      - id: check-readthedocs

  # HTML & Jinja2 template formatter and linter (Sphinx sidebar templates)
  - repo: https://github.com/djlint/djLint
    rev: v1.54.0
    hooks:
      - id: djlint-reformat-jinja
        files: ^docs/source/_templates/
        types_or:
          - html
          - jinja
      - id: djlint-jinja
        files: ^docs/source/_templates/
        types_or:
          - html
          - jinja

  # Markdown heading numbering
  - repo: https://github.com/jsh9/markdown-heading-numbering
    rev: 0.1.1
    hooks:
      - id: markdown-heading-numbering
        exclude: ^(CHANGELOG|THIRD_PARTY_LICENSES)\.md$

  # Markdown TOC creator
  - repo: https://github.com/jsh9/markdown-toc-creator
    rev: 0.1.3
    hooks:
      - id: markdown-toc-creator
        args:
          - --proactive
          - 'False'

  # Markdown format
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter==2.2.0
          - mdformat-gfm==1.0.0  # also provides table support (mdformat-tables is archived and merged here)
          - mdformat-ruff==0.1.3
          - ruff==0.17.6  # keep in sync with the ruff-pre-commit rev

  # PyMarkdown linter
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.42  # zizmor: ignore[ref-confusion] -- upstream publishes matching branch and tag names
    hooks:
      - id: pymarkdown

  # Shell script formatter (prebuilt Python wheel)
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args:
          - -i
          - '2'
          - -ci
          - -bn
          - -w

  # Shell script static analysis linter (prebuilt Python wheel)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Dockerfile linter (prebuilt Python wheel)
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args:
          - --failure-threshold=warning

  # GitHub Actions workflow syntax and expression linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Security: GitHub Actions, Dependabot, and pre-commit static analysis
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.33.1
    hooks:
      - id: zizmor

  # Security: Detect high-entropy secrets and credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (^|/)(uv|Cargo)\.lock$

  # Security & hybrid architecture: Offline multi-language Semgrep ruleset
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.187.0
    hooks:
      - id: semgrep
        types_or:
          - python
          - rust
        args:
          - --config
          - .semgrep.yml
          - --error
          - --metrics=off
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions

  # Pygrep static regex hygiene and security checks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char
        exclude: ^(\.pre-commit-config\.yaml)$

  # Codespell for typo detection
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: \.(po|pot)$

  # Blocklint for non-inclusive language
  - repo: https://github.com/PrincetonUniversity/blocklint
    rev: v0.3.0
    hooks:
      - id: blocklint

  # Conventional Commits verification
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg

  # Vale prose, code-comment, and commit-message linter
  - repo: https://github.com/vale-cli/vale
    rev: v3.28.1
    hooks:
      - id: vale
        alias: vale-sync
        name: vale sync
        entry: sh -c 'VALE_GRAMMARS_URL=https://github.com/vale-cli/vale/releases/download/v3.28.1 vale "$@"' --
        pass_filenames: false
        args:
          - sync
        stages:
          - manual
      - id: vale
        args:
          - --output=line
          - --minAlertLevel=error
      - id: vale-commit-msg
        entry: sh tools/vale_commit_msg.sh
        stages:
          - commit-msg

  # File Line Length Enforcement
  - repo: local
    hooks:
      - id: file-line-length-check
        name: File Line Length Check
        entry: python tools/line_linter.py
        language: python
        types:
          - text
        additional_dependencies:
          - pathspec
          - identify
          - typer
          - pyyaml
          - rich
        pass_filenames: true
      - id: suppression-audit
        name: Suppression Audit Check
        entry: python tools/suppression_auditor.py
        language: python
        types:
          - python
        additional_dependencies:
          - pathspec
          - identify
          - typer
          - pyyaml
          - rich
        pass_filenames: true
      - id: check-no-absolute-locale-paths
        name: Check no absolute paths in message catalogs
        entry: '^#: (\S+\s+)*(/|[A-Za-z]:[\\/])'
        language: pygrep
        files: ^src/findfmt/locale/.*\.(po|pot)$
      - id: i18n-catalog-check
        name: Validate gettext catalogs and completeness
        entry: python -m tools.i18n validate
        language: python
        additional_dependencies:
          - pathspec
          - identify
          - typer
          - pyyaml
          - rich
        files: ^src/findfmt/.*\.(py|po|pot)$
        pass_filenames: false
