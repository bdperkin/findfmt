StylesPath = .github/styles
MinAlertLevel = warning

Packages = Google, proselint

Vocab = findfmt

[[!.]*.md]
BasedOnStyles = Vale, Google, proselint

# Tailored rule configurations for technical CLI documentation
Google.Headings = NO
Google.WordList = NO
Google.Acronyms = NO
Google.Parens = NO
Google.Colons = NO
Google.OptionalPlurals = NO
Google.Will = NO
Google.OxfordComma = suggestion
Google.Latin = suggestion
Google.EmDash = suggestion
Google.Contractions = suggestion
Google.We = suggestion
Google.WordListCase = suggestion
proselint.CurlyQuotes = NO
proselint.Diacritical = suggestion
proselint.Exclamation = NO

# Token ignores: ignore URLs and inline links
TokenIgnores = (https?://[^\s]+)

[*.{py,rs}]
BasedOnStyles = Vale, Google, proselint
# Identifiers, flags, and technical tokens in comments are covered by codespell;
# disable prose-only punctuation/annotation rules that conflict with docstrings and macros.
Vale.Spelling = NO
Google.Headings = NO
Google.WordList = NO
Google.Acronyms = NO
Google.Parens = NO
Google.Colons = NO
Google.OptionalPlurals = NO
Google.Will = NO
Google.Exclamation = NO
Google.Ordinal = NO
Google.Quotes = NO
Google.Periods = NO
Google.Spacing = NO
Google.Units = NO
Google.OxfordComma = suggestion
Google.Latin = suggestion
Google.EmDash = suggestion
Google.Contractions = suggestion
Google.We = suggestion
Google.WordListCase = suggestion
proselint.Annotations = NO
proselint.CurlyQuotes = NO
proselint.Diacritical = suggestion
proselint.Ellipsis = NO
proselint.Exclamation = NO
proselint.Multiplication = NO
proselint.Typography = NO
TokenIgnores = (https?://[^\s]+), (`[^`]+`)

[COMMIT_EDITMSG]
BasedOnStyles = Vale, Google, proselint
Google.Headings = NO
Google.WordList = NO
Google.Acronyms = NO
Google.Parens = NO
Google.Colons = NO
Google.OptionalPlurals = NO
Google.Will = NO
Google.Exclamation = NO
Google.Quotes = NO
Google.Periods = NO
Google.OxfordComma = suggestion
Google.Latin = suggestion
Google.EmDash = suggestion
Google.Contractions = suggestion
Google.We = suggestion
Google.WordListCase = suggestion
proselint.Annotations = NO
proselint.CurlyQuotes = NO
proselint.Diacritical = suggestion
proselint.Exclamation = NO
TokenIgnores = (https?://[^\s]+), (`[^`]+`), (^[a-z]+(\([^)]+\))?!?:), (^Signed-off-by:.*$), (^Co-authored-by:.*$), (^#.*$), (\b[0-9a-f]{7,40}\b)
