---
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      - git fetch --unshallow --tags --force || git fetch --tags --force
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - >-
        HATCH_MATURIN_DISABLE=1
        UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}"
        uv sync --locked --no-default-groups --group docs
    post_build:
      - '"${READTHEDOCS_VIRTUALENV_PATH}/bin/sphinx-intl" build -d docs/source/locale'
      - >-
        for lang in en es fr de ja; do
        "${READTHEDOCS_VIRTUALENV_PATH}/bin/sphinx-build"
        -b html
        -d "docs/_build/doctrees-${lang}"
        -D "language=${lang}"
        -A in_lang_subdir=1
        docs/source
        "${READTHEDOCS_OUTPUT}/html/${lang}"
        -W --keep-going || exit $?;
        done

sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - htmlzip
