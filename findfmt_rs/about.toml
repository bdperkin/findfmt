# cargo-about configuration for generating THIRD_PARTY_LICENSES.md (#579).
# Run from repository root:
#   cargo about generate --manifest-path findfmt_rs/Cargo.toml \
#     --config findfmt_rs/about.toml findfmt_rs/about.hbs -o THIRD_PARTY_LICENSES.md

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

[findfmt_rs.clarify]
license = "MIT"

[[findfmt_rs.clarify.files]]
path = "../LICENSE"
license = "MIT"
checksum = "dd4fba8245bbdf1fefd1073bf6bb369907d85584006b03bbb474441c390edd40" # pragma: allowlist secret

# Upstream microsoft/windows-rs leaves `<year> <copyright holders>` in `license-mit`,
# while `license-apache-2.0` carries the filled-in `Copyright (c) Microsoft Corporation.` notice.
[windows-link.clarify]
license = "Apache-2.0"

[[windows-link.clarify.files]]
path = "license-apache-2.0"
license = "Apache-2.0"
checksum = "c16f8dcf1a368b83be78d826ea23de4079fe1b4469a0ab9ee20563f37ff3d44b" # pragma: allowlist secret

[windows-sys.clarify]
license = "Apache-2.0"

[[windows-sys.clarify.files]]
path = "license-apache-2.0"
license = "Apache-2.0"
checksum = "c16f8dcf1a368b83be78d826ea23de4079fe1b4469a0ab9ee20563f37ff3d44b" # pragma: allowlist secret
