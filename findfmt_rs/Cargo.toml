[package]
name = "findfmt_rs"
version = "1.4.1"
edition = "2024"
rust-version = "1.88"
description = "Native PyO3 acceleration bindings for findfmt file discovery and classification."
authors = ["Brandon Perkins <bdperkin@gmail.com>"]
# Canonical MIT license text resides at ../LICENSE (mirrored in pyproject.toml).
# Cargo warns when both `license` and `license-file` are set simultaneously;
# standard SPDX `license = "MIT"` satisfies Cargo, cargo-deny, and cargo-about.
license = "MIT"
readme = "../README.md"
homepage = "https://bdperkin.github.io/findfmt"
repository = "https://github.com/bdperkin/findfmt"
publish = false

[lib]
name = "_rust_ext"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
globset = "0.4"
ignore = "0.4"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
