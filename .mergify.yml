---
# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
# Mergify automated PR queue, merge triggers, and size labeling configuration for findfmt

queue_rules:
  - name: default
    merge_method: squash
    update_method: rebase
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
      - check-success = Validate Conventional Commit PR Title
      - check-success = Build Documentation
      - check-success = CodeQL Security Analysis
      - check-success = Dependency Review
      - check-success = Lint Prose (Vale)
      - check-success = Package Metadata & Wheel Contents
      - check-success = Container Smoke Test
      - check-success = Performance Benchmarks
      - check-success = Dependency Smoke Matrix (lowest-direct - disallow)
      - check-success = Dependency Smoke Matrix (highest - allow)
      - check-success = Test (ubuntu-latest - Python 3.11)
      - check-success = Test (ubuntu-latest - Python 3.12)
      - check-success = Test (ubuntu-latest - Python 3.13)
      - check-success = Test (ubuntu-latest - Python 3.14)
      - check-success = Test (ubuntu-latest - Python 3.15)
      - check-success = Test (macos-latest - Python 3.11)
      - check-success = Test (macos-latest - Python 3.12)
      - check-success = Test (macos-latest - Python 3.13)
      - check-success = Test (macos-latest - Python 3.14)
      - check-success = Test (macos-latest - Python 3.15)
      - check-success = Test (windows-latest - Python 3.11)
      - check-success = Test (windows-latest - Python 3.12)
      - check-success = Test (windows-latest - Python 3.13)
      - check-success = Test (windows-latest - Python 3.14)
      - check-success = Test (windows-latest - Python 3.15)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.11)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.15)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.11)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.15)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.11)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.15)
    merge_conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
      - check-success = Build Documentation
      - check-success = CodeQL Security Analysis
      - check-success = Dependency Review
      - check-success = Lint Prose (Vale)
      - check-success = Package Metadata & Wheel Contents
      - check-success = Container Smoke Test
      - check-success = Performance Benchmarks
      - check-success = Dependency Smoke Matrix (lowest-direct - disallow)
      - check-success = Dependency Smoke Matrix (highest - allow)
      - check-success = Test (ubuntu-latest - Python 3.11)
      - check-success = Test (ubuntu-latest - Python 3.12)
      - check-success = Test (ubuntu-latest - Python 3.13)
      - check-success = Test (ubuntu-latest - Python 3.14)
      - check-success = Test (ubuntu-latest - Python 3.15)
      - check-success = Test (macos-latest - Python 3.11)
      - check-success = Test (macos-latest - Python 3.12)
      - check-success = Test (macos-latest - Python 3.13)
      - check-success = Test (macos-latest - Python 3.14)
      - check-success = Test (macos-latest - Python 3.15)
      - check-success = Test (windows-latest - Python 3.11)
      - check-success = Test (windows-latest - Python 3.12)
      - check-success = Test (windows-latest - Python 3.13)
      - check-success = Test (windows-latest - Python 3.14)
      - check-success = Test (windows-latest - Python 3.15)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.11)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.15)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.11)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.15)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.11)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.15)

pull_request_rules:
  - name: Automatic merge queue for Renovate and pre-commit.ci bot PRs
    description: Queue automated dependency and pre-commit PRs once pre-commit.ci, Codecov, CodeRabbit, and CI checks
      pass
    conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - or:
          - author = renovate[bot]
          - author = pre-commit-ci[bot]
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
      - check-success = Validate Conventional Commit PR Title
    actions:
      queue:
        name: default

  - name: Automatic merge queue for approved or automerge-labeled PRs
    description: Queue maintainer and contributor PRs when approved or labeled once pre-commit.ci, Codecov, CodeRabbit,
      and CI checks pass
    conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - or:
          - label = automerge
          - label = status:ready-to-merge
          - '#approved-reviews-by >= 1'
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
      - check-success = Validate Conventional Commit PR Title
    actions:
      queue:
        name: default

  - name: Label small pull requests (size:S)
    description: Automatically label pull requests with fewer than 100 modified lines as size:S
    conditions:
      - -closed
      - '#modified-lines < 100'
    actions:
      label:
        add:
          - size:S
        remove:
          - size:M
          - size:L
          - size:XL

  - name: Label medium pull requests (size:M)
    description: Automatically label pull requests with 100 to 499 modified lines as size:M
    conditions:
      - -closed
      - '#modified-lines >= 100'
      - '#modified-lines < 500'
    actions:
      label:
        add:
          - size:M
        remove:
          - size:S
          - size:L
          - size:XL

  - name: Label large pull requests (size:L)
    description: Automatically label pull requests with 500 to 999 modified lines as size:L
    conditions:
      - -closed
      - '#modified-lines >= 500'
      - '#modified-lines < 1000'
    actions:
      label:
        add:
          - size:L
        remove:
          - size:S
          - size:M
          - size:XL

  - name: Label extra-large pull requests (size:XL)
    description: Automatically label pull requests with 1000 or more modified lines as size:XL
    conditions:
      - -closed
      - '#modified-lines >= 1000'
    actions:
      label:
        add:
          - size:XL
        remove:
          - size:S
          - size:M
          - size:L

  - name: Label breaking-change pull requests from Conventional Commit title
    description: Automatically label pull requests containing breaking change bang (!:) in title
    conditions:
      - -closed
      - 'title ~= ^[a-z]+(\([^)]+\))?!: '
    actions:
      label:
        add:
          - breaking change

  - name: Label feature pull requests from Conventional Commit title
    description: Automatically label feat pull requests as enhancement for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^feat(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - enhancement

  - name: Label bug-fix pull requests from Conventional Commit title
    description: Automatically label fix pull requests as bug for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^fix(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - bug

  - name: Label documentation pull requests from Conventional Commit title
    description: Automatically label docs pull requests as documentation for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^docs(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - documentation

  - name: Label performance pull requests from Conventional Commit title
    description: Automatically label perf pull requests as performance for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^perf(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - performance

  - name: Label refactoring pull requests from Conventional Commit title
    description: Automatically label refactor pull requests as refactor for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^refactor(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - refactor

  - name: Label security pull requests from Conventional Commit title
    description: Automatically label sec pull requests as security for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^sec(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - security

  - name: Label testing pull requests from Conventional Commit title
    description: Automatically label test pull requests as testing for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^test(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - testing

  - name: Label CI/CD pull requests from Conventional Commit title
    description: Automatically label ci pull requests as ci/cd for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^ci(\([^)]+\))?!?: '
    actions:
      label:
        add:
          - ci/cd

  - name: Label dependency pull requests from Conventional Commit title
    description: Automatically label chore(deps) pull requests as dependencies for Release Drafter
    conditions:
      - -closed
      - 'title ~= ^chore\(deps\)!?: '
    actions:
      label:
        add:
          - dependencies

  - name: Label release-preparation pull requests from Conventional Commit title
    description: Automatically label chore(release) pull requests as release to exclude from Release Drafter
    conditions:
      - -closed
      - 'title ~= ^chore\(release\)!?: '
    actions:
      label:
        add:
          - release

  - name: Label maintenance pull requests from Conventional Commit title
    description: Automatically label build, style, revert, and general chore pull requests as type:chore
    conditions:
      - -closed
      - 'title ~= ^(build|style|revert|chore)(\([^)]+\))?!?: '
      - '-title ~= ^chore\((deps|release)\)'
    actions:
      label:
        add:
          - type:chore

  - name: Remove stale breaking-change label when open PR title changes
    description: Reconcile breaking change label when an open pull request title no longer marks a breaking change
    conditions:
      - -closed
      - '-title ~= ^[a-z]+(\([^)]+\))?!: '
      - label = breaking change
    actions:
      label:
        remove:
          - breaking change

  - name: Remove stale enhancement label when open PR title changes
    description: Reconcile enhancement label when an open pull request title is no longer feat
    conditions:
      - -closed
      - '-title ~= ^feat(\([^)]+\))?!?: '
      - label = enhancement
    actions:
      label:
        remove:
          - enhancement

  - name: Remove stale bug label when open PR title changes
    description: Reconcile bug label when an open pull request title is no longer fix
    conditions:
      - -closed
      - '-title ~= ^fix(\([^)]+\))?!?: '
      - label = bug
    actions:
      label:
        remove:
          - bug

  - name: Remove stale performance label when open PR title changes
    description: Reconcile performance label when an open pull request title is no longer perf
    conditions:
      - -closed
      - '-title ~= ^perf(\([^)]+\))?!?: '
      - label = performance
    actions:
      label:
        remove:
          - performance

  - name: Remove stale refactor label when open PR title changes
    description: Reconcile refactor label when an open pull request title is no longer refactor
    conditions:
      - -closed
      - '-title ~= ^refactor(\([^)]+\))?!?: '
      - label = refactor
    actions:
      label:
        remove:
          - refactor

  - name: Remove stale dependencies label when open PR title changes
    description: Reconcile dependencies label when an open pull request title is no longer chore(deps)
    conditions:
      - -closed
      - '-title ~= ^chore\(deps\)!?: '
      - -author = renovate[bot]
      - label = dependencies
    actions:
      label:
        remove:
          - dependencies

  - name: Remove stale release label when open PR title changes
    description: Reconcile release label when an open pull request title is no longer chore(release)
    conditions:
      - -closed
      - '-title ~= ^chore\(release\)!?: '
      - label = release
    actions:
      label:
        remove:
          - release
