---
# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
# Mergify automated PR queue, merge triggers, and size labeling configuration for findfmt

queue_rules:
  - name: default
    merge_method: squash
    update_method: rebase
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
      - check-success = Build Documentation
      - check-success = CodeQL Security Analysis
      - check-success = Dependency Review
      - check-success = Lint Prose (Vale)
      - check-success = Package Metadata & Wheel Contents
      - check-success = Container Smoke Test
      - check-success = Performance Benchmarks
      - check-success = Dependency Smoke Matrix (lowest-direct - disallow)
      - check-success = Dependency Smoke Matrix (highest - allow)
      - check-success = Test (ubuntu-latest - Python 3.11)
      - check-success = Test (ubuntu-latest - Python 3.12)
      - check-success = Test (ubuntu-latest - Python 3.13)
      - check-success = Test (ubuntu-latest - Python 3.14)
      - check-success = Test (ubuntu-latest - Python 3.15)
      - check-success = Test (macos-latest - Python 3.11)
      - check-success = Test (macos-latest - Python 3.12)
      - check-success = Test (macos-latest - Python 3.13)
      - check-success = Test (macos-latest - Python 3.14)
      - check-success = Test (macos-latest - Python 3.15)
      - check-success = Test (windows-latest - Python 3.11)
      - check-success = Test (windows-latest - Python 3.12)
      - check-success = Test (windows-latest - Python 3.13)
      - check-success = Test (windows-latest - Python 3.14)
      - check-success = Test (windows-latest - Python 3.15)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.11)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.15)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.11)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.15)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.11)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.15)
    merge_conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
      - check-success = Build Documentation
      - check-success = CodeQL Security Analysis
      - check-success = Dependency Review
      - check-success = Lint Prose (Vale)
      - check-success = Package Metadata & Wheel Contents
      - check-success = Container Smoke Test
      - check-success = Performance Benchmarks
      - check-success = Dependency Smoke Matrix (lowest-direct - disallow)
      - check-success = Dependency Smoke Matrix (highest - allow)
      - check-success = Test (ubuntu-latest - Python 3.11)
      - check-success = Test (ubuntu-latest - Python 3.12)
      - check-success = Test (ubuntu-latest - Python 3.13)
      - check-success = Test (ubuntu-latest - Python 3.14)
      - check-success = Test (ubuntu-latest - Python 3.15)
      - check-success = Test (macos-latest - Python 3.11)
      - check-success = Test (macos-latest - Python 3.12)
      - check-success = Test (macos-latest - Python 3.13)
      - check-success = Test (macos-latest - Python 3.14)
      - check-success = Test (macos-latest - Python 3.15)
      - check-success = Test (windows-latest - Python 3.11)
      - check-success = Test (windows-latest - Python 3.12)
      - check-success = Test (windows-latest - Python 3.13)
      - check-success = Test (windows-latest - Python 3.14)
      - check-success = Test (windows-latest - Python 3.15)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.11)
      - check-success = Packaging Smoke Test (ubuntu-latest - Python 3.15)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.11)
      - check-success = Packaging Smoke Test (macos-latest - Python 3.15)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.11)
      - check-success = Packaging Smoke Test (windows-latest - Python 3.15)

pull_request_rules:
  - name: Automatic merge queue for Renovate and pre-commit.ci bot PRs
    description: Queue automated dependency and pre-commit PRs once pre-commit.ci, Codecov, CodeRabbit, and CI checks
      pass
    conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - or:
          - author = renovate[bot]
          - author = pre-commit-ci[bot]
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
    actions:
      queue:
        name: default

  - name: Automatic merge queue for approved or automerge-labeled PRs
    description: Queue maintainer and contributor PRs when approved or labeled once pre-commit.ci, Codecov, CodeRabbit,
      and CI checks pass
    conditions:
      - base = main
      - -draft
      - -conflict
      - '#changes-requested-reviews-by = 0'
      - '#review-threads-unresolved = 0'
      - or:
          - label = automerge
          - label = status:ready-to-merge
          - '#approved-reviews-by >= 1'
      - check-success = pre-commit.ci - pr
      - check-success = CodeRabbit
      - check-success = codecov/project
      - check-success = Code Quality & Gatekeeping
    actions:
      queue:
        name: default

  - name: Label small pull requests (size:S)
    description: Automatically label pull requests with fewer than 100 modified lines as size:S
    conditions:
      - -closed
      - '#modified-lines < 100'
    actions:
      label:
        add:
          - size:S
        remove:
          - size:M
          - size:L
          - size:XL

  - name: Label medium pull requests (size:M)
    description: Automatically label pull requests with 100 to 499 modified lines as size:M
    conditions:
      - -closed
      - '#modified-lines >= 100'
      - '#modified-lines < 500'
    actions:
      label:
        add:
          - size:M
        remove:
          - size:S
          - size:L
          - size:XL

  - name: Label large pull requests (size:L)
    description: Automatically label pull requests with 500 to 999 modified lines as size:L
    conditions:
      - -closed
      - '#modified-lines >= 500'
      - '#modified-lines < 1000'
    actions:
      label:
        add:
          - size:L
        remove:
          - size:S
          - size:M
          - size:XL

  - name: Label extra-large pull requests (size:XL)
    description: Automatically label pull requests with 1000 or more modified lines as size:XL
    conditions:
      - -closed
      - '#modified-lines >= 1000'
    actions:
      label:
        add:
          - size:XL
        remove:
          - size:S
          - size:M
          - size:L
