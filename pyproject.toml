[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "findfmt"
description = """\
  A.gitignore-aware file discovery and classification suite that locates files by content format, shebang, and MIME \
  tag for automated linting, formatting, and CI pipelines.\
  """
readme = "README.md"
keywords = [
  "classification",
  "discovery",
  "find",
  "format",
  "gitignore",
  "identify",
  "linting",
  "mime",
  "shebang",
]
license = { text = "MIT" }
authors = [
  { name = "Brandon Perkins", email = "bdperkin@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dynamic = [ "version" ]
dependencies = [
  "identify>=2.6",
  "pathspec>=0.12",
  "pyyaml>=6",
  "rich>=13",
  "tomli>=2.0.1; python_version<'3.11'",
  "typer>=0.12",
  "typing-extensions>=4; python_version<'3.12'",
]
urls.Changelog = "https://github.com/bdperkin/findfmt/blob/main/CHANGELOG.md"
urls.Documentation = "https://bdperkin.github.io/findfmt"
urls.Homepage = "https://github.com/bdperkin/findfmt"
urls.Issues = "https://github.com/bdperkin/findfmt/issues"
urls.Repository = "https://github.com/bdperkin/findfmt"
scripts.findfilefmt = "findfmt.cli:main_findfilefmt"
scripts.findfilemime = "findfmt.cli:main_findfilemime"
scripts.findfiles = "findfmt.cli:main_findfiles"
scripts.findfmt = "findfmt.cli:app"
scripts.findfmt0 = "findfmt.cli:main_findfmt0"
scripts.findshebang = "findfmt.cli:main_findshebang"
scripts.findsummary = "findfmt.cli:main_findsummary"

[dependency-groups]
dev = [
  "pre-commit>=4",
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.14",
]
docs = [
  "furo>=2024.8.6",
  "myst-parser>=4",
  "sphinx>=8",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-copybutton>=0.5.2",
  "sphinxcontrib-typer>=0.9.2",
]
lint = [
  "codespell>=2.3",
  "deptry>=0.20",
  "interrogate>=1.7",
  "pyroma>=4.2",
  "radon>=6.0.1",
  "ruff>=0.8",
  "ty>=0.0.80",
  "types-pyyaml>=6",
  "vulture>=2.11",
  "xenon>=0.9.1",
  "yamllint>=1.35",
]

[tool.hatch]
version.source = "vcs"
version.fallback-version = "0.4.1.dev0"
build.targets.wheel.packages = [ "src/findfmt" ]
build.targets.sdist.include = [
  "/src",
  "/tests",
  "/docs",
  "/tools",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = [ "src", "tests", "tools" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Missing trailing comma (handled by formatter)
  "CPY001", # Missing copyright notice at top of file
  "D203",   # 1 blank line before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "ISC001", # Single line implicit string concatenation (formatter conflict)
]
lint.per-file-ignores."docs/**/*" = [ "A001", "INP001" ]
lint.per-file-ignores."src/findfmt/cli/help.py" = [ "FBT001", "FBT002" ]
lint.per-file-ignores."src/findfmt/cli/main.py" = [
  "ARG001",
  "FBT001",
  "FBT002",
  "PLR0913",
  "PLR0917",
]
lint.per-file-ignores."src/findfmt/diagnostics.py" = [ "FBT001", "FBT002" ]
lint.per-file-ignores."src/findfmt/entrypoints.py" = [ "PLC0415" ]
lint.per-file-ignores."tests/**/*" = [
  "ANN",
  "D",
  "PLR2004",
  "S",
  "TC",
]
lint.per-file-ignores."tools/**/*" = [ "INP001", "S", "T201" ]
lint.pydocstyle.convention = "google"

[tool.codespell]
skip = "./.git,./build,./dist,./.venv,./docs/_build,./docs/build,./assets"
quiet-level = 3

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = false
exclude = [ "build", "dist", "docs", "tests", "tools" ]
color = true
whitelist-regex = []

[tool.deptry]
extend_exclude = [ "docs", "tests", "tools" ]
per_rule_ignores = { DEP002 = [ "tomli", "typing-extensions" ] }
known_first_party = [ "findfmt" ]

[tool.vulture]
exclude = [ "docs", "tests", "tools" ]
ignore_names = [ "diagnostics", "help_all", "known_tags", "relative_paths", "verbose" ]
min_confidence = 80

[tool.ty]
rules.all = "error"
rules.missing-direct-dependency = "ignore"
terminal.error-on-warning = true
analysis.strict-equality-semantics = true
analysis.strict-generic-narrowing = true

[tool.pytest]
ini_options.minversion = "8.0"
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = """\
  -ra -q --strict-markers --strict-config --cov=findfmt --cov-report=term-missing --cov-report=xml \
  --cov-fail-under=100 --junitxml=junit.xml -o junit_family=xunit2\
  """

[tool.coverage]
run.source = [ "findfmt" ]
run.omit = [ "tests/*" ]
run.branch = true
report.fail_under = 100
report.exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
report.show_missing = true

[tool.radon]
cc_min = "A"
show_complexity = true
average = true

[tool.xenon]
max_absolute = "B"
max_modules = "B"
max_average = "A"
exclude = "tests/*,docs/*,tools/*"

[tool.pymarkdown]
plugins.MD013.enabled = false
plugins.MD024.siblings_only = true
plugins.MD031.enabled = false
plugins.MD033.enabled = false
plugins.MD041.enabled = false

[tool.line-linter]
include = [
  "src/**/*.py",
  "tools/**/*.py",
  "tests/**/*.py",
  "*.md",
  "docs/**/*.md",
  "*.yaml",
  "*.yml",
  ".github/**/*.yml",
  ".github/**/*.yaml",
]
exclude = [
  "dist/**",
  "build/**",
  ".venv/**",
  ".git/**",
  ".clusterfuzzlite/**",
  ".github/styles/**",
  "docs/_build/**",
  ".pytest_cache/**",
  ".mypy_cache/**",
  ".ruff_cache/**",
  "__pycache__/**",
  "*.lock",
  "uv.lock",
]
overrides.python = { warning = 300, error = 500 }
overrides.yaml = { warning = 150, error = 300 }
