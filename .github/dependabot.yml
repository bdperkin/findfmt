---
version: 2
updates:
  # Dependabot for GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      codeql-action:
        patterns: [github/codeql-action*]
      actions:
        patterns: [actions/*]
      docker:
        patterns: [docker/*]
      clusterfuzzlite:
        patterns:
          - google/clusterfuzzlite*

  # Dependabot for Python Dependencies (pip / uv)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
