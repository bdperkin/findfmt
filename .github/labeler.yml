---
# Configuration for actions/labeler
area:cli:
  - changed-files:
      - any-glob-to-any-file: [src/findfmt/cli/**, src/findfmt/__main__.py]
area:classifier:
  - changed-files:
      - any-glob-to-any-file:
          - src/findfmt/classifier.py
          - src/findfmt/metadata.py
          - src/findfmt/sizes.py
          - src/findfmt/utils/**
area:traversal:
  - changed-files:
      - any-glob-to-any-file: [src/findfmt/traversal/**, src/findfmt/parsers/**]
area:packaging:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock
          - Dockerfile
          - .dockerignore
area:docs:
  - changed-files:
      - any-glob-to-any-file: [docs/**, '*.md']
area:rust:
  - changed-files:
      - any-glob-to-any-file:
          - findfmt_rs/**
          - src/findfmt/core.py
          - src/findfmt/_fallback.py
          - src/findfmt/_rust_ext.pyi
documentation:
  - changed-files:
      - any-glob-to-any-file: [docs/**, '*.md']
ci/cd:
  - changed-files:
      - any-glob-to-any-file: [.github/workflows/**]
pre-commit:
  - changed-files:
      - any-glob-to-any-file:
          - .pre-commit-config.yaml
          - tools/sync_pre_commit_deps.py
testing:
  - changed-files:
      - any-glob-to-any-file: [tests/**]
security:
  - changed-files:
      - any-glob-to-any-file:
          - SECURITY.md
          - .gitguardian.yaml
          - .secrets.baseline
          - .trivyignore.yaml
type:chore:
  - changed-files:
      - any-glob-to-any-file: [.gitignore, .gitattributes, cliff.toml]
