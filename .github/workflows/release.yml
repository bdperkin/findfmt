---
name: Release & Publish
on:
  push:
    tags: [v*.*.*]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string
permissions:
  contents: read
env:
  # The tag being released: the workflow_dispatch input, or the pushed tag (#327).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  verify-release:
    name: Verify Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.15'
      - name: Verify Release Tag
        run: |
          python tools/verify_release_version.py --tag "$RELEASE_TAG"
          # The pypi/testpypi environments only deploy v*.*.* tags; dispatch on the tag itself (#495).
          test "$GITHUB_REF" = "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          # The release notes come from CHANGELOG.md; fail now if it was not prepared (#498).
          python tools/release_notes.py --tag "$RELEASE_TAG" > /dev/null
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Verify Complete Quality Suite
        run: uv run python tools/verify_quality.py
  build-distributions:
    name: Build Distributions
    needs: verify-release
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.notes.outputs.content }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Build Distributions via uv
        run: uv build
      - name: Verify Built Version Matches Release Tag
        run: python tools/verify_release_version.py --tag "$RELEASE_TAG" --dist dist
      - name: Verify Distribution Packages with Twine
        run: uv run twine check --strict dist/*
      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo "content<<RELEASE_NOTES_EOF"
            python tools/release_notes.py --tag "$RELEASE_TAG"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build-distributions
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/findfmt/
    permissions:
      id-token: write
    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Allows re-running a release that failed after the TestPyPI upload.
          skip-existing: true
  publish-pypi:
    name: Publish to Production PyPI
    needs: [build-distributions, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/findfmt/
    permissions:
      id-token: write
    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
  create-github-release:
    name: Create GitHub Release
    needs: [build-distributions, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body: ${{ needs.build-distributions.outputs.release_body }}
          files: dist/*
          draft: false
          prerelease: false
  containerize:
    name: Build & Publish Container to GHCR
    needs: [build-distributions, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sigstore signing of the image's build provenance attestation (#328).
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Build Image for Verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: findfmt:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Image Version and Contents
        run: |
          expected="findfmt ${RELEASE_TAG#v}"
          actual="$(docker run --rm findfmt:verify --version)"
          echo "$actual"
          test "$actual" = "$expected"
          docker run --rm --entrypoint sh findfmt:verify -c '! command -v uv && ! command -v uvx'
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/bdperkin/findfmt
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
      - name: Build and Push Docker Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/bdperkin/findfmt
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
