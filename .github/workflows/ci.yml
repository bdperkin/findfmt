---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-gate:
    name: Code Quality & Gatekeeping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run Ruff Check
        run: uv run ruff check
      - name: Run Ruff Format Check
        run: uv run ruff format --check
      - name: Run Ty Type Checker
        run: uv run ty check
      - name: Run Interrogate (Docstrings)
        run: uv run interrogate src
      - name: Run Radon (Complexity)
        run: uv run radon cc src -s -a
      - name: Run Xenon (Complexity Assertions)
        run: uv run xenon src
      - name: Run Deptry (Dependencies)
        run: uv run deptry .
      - name: Run Vulture (Dead Code)
        run: uv run vulture src
      - name: Run Codespell (Spelling)
        run: uv run codespell
  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            python-version: 3.15-dev
            experimental: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Install Dependencies
        run: uv sync --all-groups
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Run Pytest with 100% Coverage Enforcement
        run: uv run pytest
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ !matrix.experimental }}
