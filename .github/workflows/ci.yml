---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  quality-gate:
    name: Code Quality & Gatekeeping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run Ruff Check
        run: uv run ruff check
      - name: Run Ruff Format Check
        run: uv run ruff format --check
      - name: Run Ty Type Checker
        run: uv run ty check
      - name: Run Interrogate (Docstrings)
        run: uv run interrogate src
      - name: Run Radon (Complexity)
        run: uv run radon cc src -s -a
      - name: Run Xenon (Complexity Assertions)
        run: uv run xenon src
      - name: Run Deptry (Dependencies)
        run: uv run deptry .
      - name: Run Vulture (Dead Code)
        run: uv run vulture src
      - name: Run Codespell (Spelling)
        run: uv run codespell
      - name: Verify Complete Quality Suite
        run: uv run python tools/verify_quality.py
  packaging-smoke-test:
    name: Packaging Smoke Test (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.13'
      - name: Build Distribution Packages
        run: uv build
      - name: Create Clean Virtual Environment & Install Wheel (POSIX)
        run: |
          uv venv smoke_env
          uv pip install --python smoke_env dist/*.whl
        if: runner.os != 'Windows'
      - name: Create Clean Virtual Environment & Install Wheel (Windows)
        run: |
          uv venv smoke_env
          uv pip install --python smoke_env (Get-Item dist/*.whl).FullName
        if: runner.os == 'Windows'
      - name: Verify CLI Executable (POSIX)
        run: |
          ./smoke_env/bin/findfmt --version
          ./smoke_env/bin/findfmt --help
          ./smoke_env/bin/findfmt -t python -l src
        if: runner.os != 'Windows'
      - name: Verify Wheel i18n Translations (POSIX)
        run: |
          ./smoke_env/bin/python -c '
          import gettext
          from findfmt.i18n import get_current_translation, set_locale, _
          assert set_locale("de") == "de"
          assert isinstance(get_current_translation(), gettext.GNUTranslations)
          assert _("not installed") == "nicht installiert"
          '
        if: runner.os != 'Windows'
      - name: Verify CLI Executable (Windows)
        run: |
          .\smoke_env\Scripts\findfmt.exe --version
          .\smoke_env\Scripts\findfmt.exe --help
          .\smoke_env\Scripts\findfmt.exe -t python -l src
        if: runner.os == 'Windows'
      - name: Verify Wheel i18n Translations (Windows)
        run: |
          $code = @'
          import gettext
          from findfmt.i18n import get_current_translation, set_locale, _
          assert set_locale("de") == "de"
          assert isinstance(get_current_translation(), gettext.GNUTranslations)
          assert _("not installed") == "nicht installiert"
          '@
          .\smoke_env\Scripts\python.exe -c $code
        if: runner.os == 'Windows'
  dependency-smoke-matrix:
    name: Dependency Smoke Matrix (${{ matrix.resolution }} - ${{ matrix.prerelease }})
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: lowest-direct
            prerelease: disallow
          - resolution: highest
            prerelease: allow
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.14'
      - name: Create Clean Virtual Environment
        run: uv venv smoke_env
      - name: Install Dependencies (${{ matrix.resolution }} / ${{ matrix.prerelease }})
        run: |
          uv pip install --python smoke_env --group test -e . \
            --resolution ${{ matrix.resolution }} \
            --prerelease ${{ matrix.prerelease }}
      - name: Populate Global Gitignore to Verify Hermeticity
        run: |
          mkdir -p ~/.config/git
          echo '*' > ~/.config/git/ignore
      - name: Run Pytest
        run: ./smoke_env/bin/pytest
      - name: Capture Dependency Tree on Failure
        if: failure()
        run: |
          echo "### Dependency Tree (${{ matrix.resolution }} / ${{ matrix.prerelease }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv pip tree --python smoke_env >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            python-version: 3.15-dev
            experimental: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Install Dependencies
        run: uv sync --locked --all-groups
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Populate Global Gitignore to Verify Hermeticity
        run: |
          uv run python -c "from pathlib import Path; p = Path.home() / '.config' / 'git'; p.mkdir(parents=True, exist_ok=True); (p / 'ignore').write_text('*\n', encoding='utf-8')"
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Run Pytest with 100% Coverage Enforcement
        run: uv run pytest
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
        if: ${{ !matrix.experimental }}
      - name: Upload Test Results to Codecov (Test Analytics)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: unittests
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
        if: ${{ !cancelled() && !matrix.experimental }}
