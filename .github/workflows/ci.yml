---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  quality-gate:
    name: Code Quality & Gatekeeping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run Ruff Check
        run: uv run ruff check
      - name: Run Ruff Format Check
        run: uv run ruff format --check
      - name: Run Ty Type Checker
        run: uv run ty check
      - name: Run Interrogate (Docstrings)
        run: uv run interrogate src
      - name: Run Radon (Complexity)
        run: uv run radon cc src -s -a
      - name: Run Xenon (Complexity Assertions)
        run: uv run xenon src
      - name: Run Deptry (Dependencies)
        run: uv run deptry .
      - name: Run Vulture (Dead Code)
        run: uv run vulture src
      - name: Run Codespell (Spelling)
        run: uv run codespell
      - name: Verify Complete Quality Suite
        run: uv run python tools/verify_quality.py
  packaging-smoke-test:
    name: Packaging Smoke Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The minimum and maximum supported Python (#496).
        python-version: ['3.11', '3.15']
    defaults:
      run:
        shell: bash
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build Distribution Packages
        run: uv build
      - name: Install Wheel into a Clean Virtual Environment
        run: |
          uv venv --python "$PYTHON_VERSION" smoke_env
          uv pip install --python smoke_env dist/*.whl
      - name: Smoke-Test the Installed Wheel
        run: |
          python=smoke_env/bin/python
          [ -x "$python" ] || python=smoke_env/Scripts/python.exe
          "$python" tools/smoke_wheel.py --wheel dist/*.whl
      - name: Verify pip Refuses Python 3.10
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          uv venv --seed --python 3.10 py310_env
          if py310_env/bin/python -m pip install --disable-pip-version-check dist/*.whl 2>refused.txt; then
            echo "::error::pip installed findfmt on Python 3.10"
            exit 1
          fi
          cat refused.txt
          grep -q "requires a different Python" refused.txt
  container-smoke-test:
    name: Container Smoke Test
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Build the Image from a Wheel and Test It
        env:
          FINDFMT_CONTAINER_TESTS: '1'
        run: uv run pytest tests/integration/test_container.py --no-cov -v
  dependency-smoke-matrix:
    name: Dependency Smoke Matrix (${{ matrix.resolution }} - ${{ matrix.prerelease }})
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: lowest-direct
            prerelease: disallow
          - resolution: highest
            prerelease: allow
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.14'
      - name: Create Clean Virtual Environment
        run: uv venv smoke_env
      - name: Install Dependencies (${{ matrix.resolution }} / ${{ matrix.prerelease }})
        run: |
          uv pip install --python smoke_env --group test -e . \
            --resolution ${{ matrix.resolution }} \
            --prerelease ${{ matrix.prerelease }}
      - name: Populate Global Gitignore to Verify Hermeticity
        run: |
          mkdir -p ~/.config/git
          echo '*' > ~/.config/git/ignore
      - name: Run Pytest
        run: ./smoke_env/bin/pytest
      - name: Capture Dependency Tree on Failure
        if: failure()
        run: |
          echo "### Dependency Tree (${{ matrix.resolution }} / ${{ matrix.prerelease }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv pip tree --python smoke_env >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          # Early warning for the next feature release: never gating, not advertised.
          - os: ubuntu-latest
            python-version: 3.16-dev
            experimental: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental || false }}
        continue-on-error: ${{ matrix.experimental || false }}
      # Experimental entries can request interpreters that have no runner build yet. Report that
      # instead of silently testing the runner's system Python under the experimental job name.
      - name: Report Unavailable Python Interpreter
        if: ${{ steps.setup-python.outcome != 'success' }}
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          echo "::warning title=Python ${PYTHON_VERSION} unavailable::No Python ${PYTHON_VERSION} build is available on this runner yet; dependency installation and tests were skipped."
          echo "Python ${PYTHON_VERSION} was not tested: no runner build is available yet." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Dependencies
        if: ${{ steps.setup-python.outcome == 'success' }}
        env:
          # Pin uv to the interpreter installed above so no job falls back to the system Python.
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --all-groups
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Populate Global Gitignore to Verify Hermeticity
        if: ${{ steps.setup-python.outcome == 'success' }}
        run: |
          uv run python -c "from pathlib import Path; p = Path.home() / '.config' / 'git'; p.mkdir(parents=True, exist_ok=True); (p / 'ignore').write_text('*\n', encoding='utf-8')"
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Run Pytest with 100% Coverage Enforcement
        if: ${{ steps.setup-python.outcome == 'success' }}
        run: uv run pytest
        continue-on-error: ${{ matrix.experimental || false }}
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
        if: ${{ !matrix.experimental }}
      - name: Upload Test Results to Codecov (Test Analytics)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: unittests
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
        if: ${{ !cancelled() && !matrix.experimental }}
