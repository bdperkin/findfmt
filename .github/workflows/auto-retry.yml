---
name: Auto-Retry Timed Out Workflow
on:
  # zizmor: ignore[dangerous-triggers] -- re-runs failed CI jobs by ID without code checkout
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: {}
jobs:
  rerun:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion
      == 'cancelled') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed
