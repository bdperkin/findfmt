---
name: Vale

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    name: Lint Prose (Vale)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Vale Styles
        id: cache-vale-styles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .github/styles/Google
            .github/styles/proselint
            .github/styles/config/grammars
            .github/styles/models
          key: vale-styles-v3.28.1-${{ hashFiles('.vale.ini') }}
      - name: Run Vale Prose Linter
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff  # v3.0.0
        with:
          version: 3.28.1
          files: all
          sync: ${{ steps.cache-vale-styles.outputs.cache-hit != 'true' }}
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
