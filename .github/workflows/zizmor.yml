---
name: Zizmor Security Analysis
on:
  push:
    branches: [main]
    paths: [.github/**, .pre-commit-config.yaml]
  pull_request:
    branches: [main]
    paths: [.github/**, .pre-commit-config.yaml]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  zizmor:
    name: GitHub Actions Security Analysis (zizmor)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
