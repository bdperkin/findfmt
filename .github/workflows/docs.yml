---
name: Documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.14'
      - name: Install Dependencies
        run: uv sync --locked --all-groups
      - name: Build All Sphinx Formats (Strict)
        run: make -C docs clean html dirhtml singlehtml epub man latex text texinfo
          htmlhelp qthelp devhelp json pickle xml pseudoxml linkcheck changes gettext
      - name: Upload Digital Documentation (EPUB & SingleHTML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digital-documentation
          path: |
            docs/_build/epub/*.epub
            docs/_build/singlehtml
          retention-days: 14
      - name: Upload Offline Documentation (Man, Text, Texinfo)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: offline-documentation
          path: |
            docs/_build/man/*.[1-8]
            docs/_build/text
            docs/_build/texinfo/*.texi
          retention-days: 14
      - name: Upload Help System Documentation (HTML Help, Qt Help, Devhelp)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: help-system-documentation
          path: |
            docs/_build/htmlhelp
            docs/_build/qthelp
            docs/_build/devhelp
          retention-days: 14
      - name: Upload Data & Serialization Documentation (JSON, Pickle, XML, Pseudo-XML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: serialization-documentation
          path: |
            docs/_build/json
            docs/_build/pickle
            docs/_build/xml
            docs/_build/pseudoxml
          retention-days: 14
      - name: Upload Localization Catalogs (Gettext POT)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: localization-catalogs
          path: docs/_build/gettext
          retention-days: 14
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: docs/_build/html
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
