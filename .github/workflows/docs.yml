---
name: Documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Dependencies
        run: uv sync --all-groups
      - name: Build All Sphinx Formats (Strict)
        run: make -C docs clean html epub man latex linkcheck
      - name: Setup Pages
        uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
