---
name: Performance & Rust Fuzz

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: findfmt_rs
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run Performance Benchmarks
        run: uv run pytest -m perf --no-cov -v
  rust-proptest-fuzz:
    name: Rust Proptest & Fuzz Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: |
            findfmt_rs
            findfmt_rs/fuzz
      - name: Run Clippy Static Analysis on findfmt_rs
        run: cargo clippy --manifest-path findfmt_rs/Cargo.toml --locked --no-default-features --all-targets --
          -D warnings
      - name: Run Rust Unit & Proptest Suites
        run: cargo test --manifest-path findfmt_rs/Cargo.toml --locked --no-default-features
      - name: Build & Execute cargo-fuzz Targets on Seed Corpus
        run: |-
          cargo build --manifest-path findfmt_rs/fuzz/Cargo.toml --locked --bins
          for target in fuzz_shebang_header fuzz_classifier_tags fuzz_sort_gitignore; do
            findfmt_rs/fuzz/target/debug/"$target" findfmt_rs/fuzz/seed_corpus/*.txt
          done
