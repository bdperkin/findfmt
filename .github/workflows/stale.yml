---
name: Stale Management

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions: {}

concurrency:
  group: stale-lifecycle
  cancel-in-progress: false

jobs:
  stale:
    name: Manage Inactive Issues & PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Stale Action
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-issue-stale: 30
          days-before-pr-stale: 30
          days-before-close: 7
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: status:stale
          stale-pr-label: status:stale
          stale-issue-message: |
            Thank you for opening this issue! It has been automatically marked as stale because
            there has been no activity for 30 days. If this issue is still relevant, please leave a
            comment with any updates and the stale label will be removed automatically; otherwise,
            it will be closed after 7 days of inactivity.
          close-issue-message: |
            Closing this issue as not planned after 7 days without a response following the stale
            notice. If this problem persists or you have additional context, please feel free to
            comment or request that it be reopened.
          stale-pr-message: |
            Thank you for your contribution! This pull request has been automatically marked as
            stale after 30 days of inactivity. Please push an update or leave a comment if you are
            still working on it; otherwise, it will be closed after 7 days of inactivity.
          close-pr-message: |
            Closing this pull request after 7 days of inactivity following the stale notice. Please
            feel free to reopen it or open a new pull request whenever you are ready to resume work.
          close-issue-reason: not_planned
          remove-stale-when-updated: true
          exempt-all-milestones: true
          exempt-all-assignees: true
          exempt-draft-pr: true
          exempt-issue-labels: >-
            security,epic,subtask,status:blocked,priority:critical,priority:high,good first
            issue,help wanted
          exempt-pr-labels: >-
            wip,status:blocked,status:in-review,status:ready-to-merge,automerge,security
          operations-per-run: 100
