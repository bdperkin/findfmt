---
# Codecov configuration for findfmt
codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 15
    wait_for_ci: true
coverage:
  precision: 2
  round: down
  range: 95...100
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%
parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false
comment:
  layout: reach, diff, flags, components, files
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
component_management:
  individual_components:
    - component_id: classifier
      name: classifier
      paths: [src/findfmt/classifier.py]
    - component_id: traversal
      name: traversal
      paths: [src/findfmt/traversal.py]
    - component_id: cli
      name: cli
      paths: [src/findfmt/cli.py, src/findfmt/__main__.py]
    - component_id: models
      name: models
      paths: [src/findfmt/models.py]
ignore: [tests/**/*, docs/**/*, tools/**/*]
flags:
  unittests:
    paths: [src/findfmt]
    carryforward: true
