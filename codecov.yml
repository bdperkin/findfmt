---
# Codecov configuration for findfmt
codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 15
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: 95...100
  status:
    project:
      default:
        target: 100%
        threshold: 0%
      python:
        target: 100%
        threshold: 0%
        paths:
          - src/findfmt
      rust:
        target: 100%
        threshold: 0%
        paths:
          - findfmt_rs/src
    patch:
      default:
        target: 100%
        threshold: 0%

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: reach, diff, flags, components, files
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

component_management:
  individual_components:
    - component_id: findfmt_rs
      name: findfmt_rs
      paths:
        - findfmt_rs/src/**
    - component_id: core
      name: core
      paths:
        - src/findfmt/__init__.py
        - src/findfmt/_fallback.py
        - src/findfmt/core.py
        - src/findfmt/exceptions.py
        - src/findfmt/i18n.py
    - component_id: classifier
      name: classifier
      paths:
        - src/findfmt/classifier.py
        - src/findfmt/metadata.py
        - src/findfmt/sizes.py
        - src/findfmt/utils/**
    - component_id: traversal
      name: traversal
      paths:
        - src/findfmt/traversal/**
        - src/findfmt/parsers/**
    - component_id: formatters
      name: formatters
      paths:
        - src/findfmt/formatters/**
    - component_id: cli
      name: cli
      paths:
        - src/findfmt/cli/**
        - src/findfmt/__main__.py
        - src/findfmt/diagnostics.py
        - src/findfmt/entrypoints.py
        - src/findfmt/summary.py
        - src/findfmt/terminal.py
    - component_id: models
      name: models
      paths:
        - src/findfmt/models.py

ignore:
  - tests/**/*
  - docs/**/*
  - tools/**/*
  - findfmt_rs/fuzz/**/*
  - findfmt_rs/tests/**/*
  - findfmt_rs/src/*_tests.rs

flags:
  unittests:
    paths:
      - src/findfmt
    carryforward: true
  rust:
    paths:
      - findfmt_rs/src
    carryforward: true
