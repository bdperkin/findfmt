---
# Codecov configuration for findfmt
codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 15
    wait_for_ci: true
coverage:
  precision: 2
  round: down
  range: 95...100
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%
parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false
comment:
  layout: reach, diff, flags, files
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
ignore: [tests/**/*, docs/**/*, tools/**/*]
flags:
  unittests:
    paths: [src/findfmt]
    carryforward: true
