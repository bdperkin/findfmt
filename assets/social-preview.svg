<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.08" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="640" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="240" y1="0" x2="240" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="400" y1="0" x2="400" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="560" y1="0" x2="560" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="720" y1="0" x2="720" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="880" y1="0" x2="880" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1040" y1="0" x2="1040" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="1200" y1="0" x2="1200" y2="640" />
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
  </g>

  <!-- Hero Framing Container -->
  <rect x="48" y="48" width="1184" height="544" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Visual Icon Mark (Left, scaled 2.2x) -->
  <g transform="translate(100, 140) scale(2.2)">
    <!-- File Stacks -->
    <rect x="20" y="25" width="60" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <line x1="32" y1="45" x2="68" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="58" x2="60" y2="58" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="71" x2="52" y2="71" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Magnifying Scanner Lens -->
    <circle cx="85" cy="75" r="48" fill="url(#lensGrad)" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" />
    <line x1="120" y1="110" x2="148" y2="138" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Badges Inside Lens -->
    <rect x="58" y="48" width="28" height="16" rx="4" fill="#0284c7" fill-opacity="0.9" />
    <text x="72" y="60" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">.py</text>

    <rect x="72" y="70" width="30" height="16" rx="4" fill="#7c3aed" fill-opacity="0.9" />
    <text x="87" y="82" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">#!/</text>

    <rect x="52" y="90" width="34" height="16" rx="4" fill="#059669" fill-opacity="0.9" />
    <text x="69" y="102" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">MIME</text>
  </g>

  <!-- Content & Typography (Right) -->
  <g transform="translate(510, 160)">
    <!-- Title -->
    <text x="0" y="70" fill="url(#accentGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">findfmt</text>

    <!-- Tagline -->
    <text x="0" y="130" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600">
      Content-Aware &amp; Git-Conscious File Classification
    </text>
    <text x="0" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Locates and classifies files by content heuristics, shebangs, and MIME types.
    </text>

    <!-- Pipeline Badges -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="115" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="57" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">.gitignore</text>

      <rect x="130" y="0" width="105" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="182" y="22" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">identify</text>

      <rect x="250" y="0" width="105" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text x="302" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">shebang</text>

      <rect x="370" y="0" width="95" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <text x="417" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">MIME</text>

      <rect x="480" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" />
      <text x="547" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">100% Covered</text>
    </g>

    <!-- Metadata Bottom Info -->
    <g transform="translate(0, 275)">
      <text x="0" y="16" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500">
        github.com/bdperkin/findfmt  •  MIT Licensed  •  Python 3.10+
      </text>
    </g>
  </g>
</svg>
